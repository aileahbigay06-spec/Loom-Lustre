<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loom &amp; Lustre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,700;1,400&amp;family=Montserrat:wght@300;500&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&amp;family=Tenor+Sans&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background: linear-gradient(135deg, var(--burgundy) 0%, var(--black) 100%);
        }
        .login-form {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 3rem;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .login-form h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.5rem;
            font-style: italic;
            color: var(--gold);
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
        }
        .login-form label {
            display: block;
            font-size: 0.85rem;
            color: var(--cream);
            margin-bottom: 0.5rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .login-form input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(230, 225, 214, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: var(--cream);
            font-size: 1rem;
            border-radius: 4px;
            transition: var(--transition);
        }
        .login-form input::placeholder {
            color: rgba(230, 225, 214, 0.4);
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        .login-form .cta-btn {
            width: 100%;
            margin-top: 1rem;
        }
        .signup-link {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: rgba(230, 225, 214, 0.6);
        }
        .signup-link a {
            color: var(--gold);
            text-decoration: none;
        }
        .login-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .login-hero > * {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Loom &amp; Lustre</div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul id="nav-menu">
            <li><a href="index.html">HOME</a></li>
            <li><a href="photoshoot.html">LAYOUTS</a></li>
            <li><a href="about.html">ABOUT ME</a></li>
        </ul>
    </nav>

    <section class="login-hero">
        <form class="login-form" action="/login" method="POST">
            <h1>Sign In</h1>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            
            <button type="submit" class="cta-btn">Enter</button>
            
            <div class="signup-link">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 LOOM &amp; LUSTRE | ALL RIGHTS RESERVED</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
